name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vacation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vacation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vacation_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
      STORAGE_PATH: /tmp/vacation-scheduler-test-storage
      PYTHONPATH: .
    defaults:
      run:
        working-directory: vacation_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vacation_scheduler/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run unit and PostgreSQL integration tests
        run: pytest -q
      - name: Build application Docker image
        run: docker build -t vacation-scheduler:ci .
