name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vacation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vacation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vacation_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
      STORAGE_PATH: /tmp/vacation-scheduler-test-storage
      PYTHONPATH: .
    defaults:
      run:
        working-directory: vacation_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vacation_scheduler/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run unit and PostgreSQL integration tests
        run: pytest -q
      - name: Install Chromium for browser tests
        run: |
          pip install -r requirements-e2e.txt
          playwright install --with-deps chromium
      - name: Start application for browser tests
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/vacation-scheduler-uvicorn.log 2>&1 &
          echo $! > /tmp/vacation-scheduler-uvicorn.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(60):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Application did not start")
          PY
      - name: Run real Chromium user workflow
        run: python tests/e2e_browser.py
      - name: Validate production Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Validate Nginx reverse proxy configuration
        run: |
          sed 's/app:8000/127.0.0.1:8000/g' deploy/nginx.conf > /tmp/nginx-ci.conf
          docker run --rm \
            -v "/tmp/nginx-ci.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
      - name: Build application Docker image
        run: docker build -t vacation-scheduler:ci .
      - name: Smoke test the production Compose stack
        run: |
          trap 'docker compose down -v --remove-orphans || true; rm -f .env' EXIT
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          mkdir -p storage
          sudo chown -R 10001:10001 storage
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          docker compose ps
          docker compose exec -T app alembic upgrade head
