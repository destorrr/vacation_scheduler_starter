name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vacation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vacation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vacation_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
      STORAGE_PATH: /tmp/vacation-scheduler-test-storage
      PYTHONPATH: .
    defaults:
      run:
        working-directory: vacation_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vacation_scheduler/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run unit and PostgreSQL integration tests
        run: pytest -q
      - name: Install Chromium for browser tests
        run: |
          pip install -r requirements-e2e.txt
          playwright install --with-deps chromium
      - name: Start application for browser tests
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/vacation-scheduler-uvicorn.log 2>&1 &
          echo $! > /tmp/vacation-scheduler-uvicorn.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(60):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Application did not start")
          PY
      - name: Run real Chromium user workflow
        run: python tests/e2e_browser.py
      - name: Validate production Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Validate Nginx reverse proxy configuration
        run: |
          sed 's/app:8000/127.0.0.1:8000/g' deploy/nginx.conf > /tmp/nginx-ci.conf
          docker run --rm \
            -v "/tmp/nginx-ci.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable-alpine nginx -t
      - name: Build application Docker image
        run: docker build -t vacation-scheduler:ci .
      - name: Smoke test the production Compose stack
        run: |
          trap 'docker compose down -v --remove-orphans || true; rm -f .env' EXIT
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
          mkdir -p storage
          sudo chown -R 10001:10001 storage
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/health
          for attempt in $(seq 1 30); do
            nginx_id="$(docker compose ps -q nginx)"
            nginx_health="$(docker inspect --format '{{.State.Health.Status}}' "$nginx_id")"
            if [ "$nginx_health" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$nginx_health" = "healthy"
          docker compose ps
          docker compose exec -T app alembic upgrade head

          # Verify that the production backup script captures both PostgreSQL and uploaded files.
          sudo mkdir -p storage/originals
          mkdir -p backups
          printf '%s\\n' 'original-file-before-backup' | sudo tee storage/originals/backup-restore-probe.txt >/dev/null
          printf '%s\\n' \
            "CREATE TABLE backup_restore_probe (marker text NOT NULL);" \
            "INSERT INTO backup_restore_probe VALUES ('before-backup');" \
            | docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" "$POSTGRES_DB"'
          sh scripts/backup.sh
          db_backup="$(find backups -maxdepth 1 -name 'postgres-*.sql.gz' -print -quit)"
          storage_backup="$(find backups -maxdepth 1 -name 'storage-*.tar.gz' -print -quit)"
          test -n "$db_backup"
          test -n "$storage_backup"

          # Restore the dump into a clean database, leaving the running app database untouched.
          docker compose exec -T db sh -c 'createdb -T template0 -U "$POSTGRES_USER" vacation_restore_test'
          set -o pipefail
          gunzip -c "$db_backup" | docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" vacation_restore_test'
          sudo rm storage/originals/backup-restore-probe.txt
          sudo tar -xzf "$storage_backup" -C .
          test "$(sudo cat storage/originals/backup-restore-probe.txt)" = "original-file-before-backup"
          restored_marker="$(docker compose exec -T db sh -c 'psql -At -U "$POSTGRES_USER" vacation_restore_test -c "SELECT marker FROM backup_restore_probe"')"
          test "$restored_marker" = "before-backup"
          echo "Backup/restore smoke test passed: PostgreSQL dump and storage archive restored."
