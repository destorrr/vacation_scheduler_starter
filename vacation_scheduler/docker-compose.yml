services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacation}
      POSTGRES_USER: ${POSTGRES_USER:-vacation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation} -d ${POSTGRES_DB:-vacation}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vacation}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vacation}
      STORAGE_PATH: /storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
